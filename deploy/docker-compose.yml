# EC2 배포용. 백엔드와 PostgreSQL을 한 서버에서 띄운다.
#   cd deploy && cp .env.example .env   (값 채우기)
#   docker compose up -d --build
# DB 포트는 외부에 열지 않는다. 백엔드는 호스트 80번으로 받는다.
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-catchtable}
      POSTGRES_USER: ${DB_USERNAME:-catchtable}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD를 .env에 설정하세요}
      TZ: Asia/Seoul
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-catchtable} -d ${DB_NAME:-catchtable}"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: ..
    image: catchtable-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-catchtable}
      DB_USERNAME: ${DB_USERNAME:-catchtable}
      DB_PASSWORD: ${DB_PASSWORD}
      TOSS_SECRET_KEY: ${TOSS_SECRET_KEY:-}
      LOGGING_LEVEL_COM_CATCHTABLE: ${LOG_LEVEL:-INFO}
      JAVA_OPTS: ${JAVA_OPTS:--Xms256m -Xmx512m -XX:+ExitOnOutOfMemoryError}
      TZ: Asia/Seoul
    ports:
      - "${APP_PORT:-80}:8080"
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"

volumes:
  postgres-data:
