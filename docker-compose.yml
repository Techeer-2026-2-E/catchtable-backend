# 로컬 개발용 DB.
#   docker compose up -d     실행
#   docker compose down      종료
#   docker compose down -v   종료 + 데이터 삭제
#
# 호스트 포트는 5433. 다른 프로젝트나 로컬 PostgreSQL이 쓰는 5432와 겹치지 않게 피했다.
# 5433도 이미 쓰고 있다면 .env 에 DB_PORT=5434 처럼 적으면 된다 (.env 는 커밋되지 않는다).
#
# 키워드 검색용 OpenSearch(nori 포함)는 profile search 로만 실행한다.
#   docker compose --profile search up -d
#
# Redis는 테스트와 로컬 확인용 단일 노드다. 테스트는 DB 14·15를 비우고 사용한다.
# RabbitMQ 는 해당 기능 구현 시작할 때 추가할 것
services:
  postgres:
    image: postgres:16
    container_name: catchtable-postgres
    ports:
      - "${DB_PORT:-5433}:5432"
    environment:
      POSTGRES_DB: ${DB_NAME:-catchtable}
      POSTGRES_USER: ${DB_USERNAME:-catchtable}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-catchtable}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-catchtable}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: catchtable-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"

  # 로컬 전용: 단일 노드, 보안 플러그인 끔
  opensearch:
    profiles: ["search"]
    build: docker/opensearch
    image: catchtable-opensearch:local
    container_name: catchtable-opensearch
    ports:
      - "9200:9200"
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
    volumes:
      - opensearch-data:/usr/share/opensearch/data

volumes:
  postgres-data:
  opensearch-data:
