server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: catchtable

  datasource:
    # 기본값은 로컬 docker-compose 기준. 배포 환경에서는 환경변수로 덮어쓴다.
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:catchtable}
    username: ${DB_USERNAME:catchtable}
    password: ${DB_PASSWORD:catchtable}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate   # 스키마 변경은 Flyway로만. update/create 로 바꾸지 말 것
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

# Toss Payments (시크릿 키는 환경변수로만 주입)
toss:
  secret-key: ${TOSS_SECRET_KEY:}
  base-url: ${TOSS_BASE_URL:https://api.tosspayments.com}
  connect-timeout: ${TOSS_CONNECT_TIMEOUT:5s}
  read-timeout: ${TOSS_READ_TIMEOUT:30s}
  call-timeout: ${TOSS_CALL_TIMEOUT:35s}
  max-concurrent-calls: ${TOSS_MAX_CONCURRENT_CALLS:8} # immediate rejection, no in-memory queue

# 학습용 호출 알림. simulation은 외부 API 호출이나 비용이 없다.
alimtalk:
  enabled: ${ALIMTALK_ENABLED:false}
  mode: ${ALIMTALK_MODE:simulation}
  solapi:
    base-url: ${SOLAPI_BASE_URL:https://api.solapi.com}
    api-key: ${SOLAPI_API_KEY:}
    api-secret: ${SOLAPI_API_SECRET:}
    channel-id: ${SOLAPI_CHANNEL_ID:}
    template-id: ${SOLAPI_TEMPLATE_ID:}
    webhook-secret: ${SOLAPI_WEBHOOK_SECRET:}

management:
  endpoints:
    web:
      exposure:
        include: health, info

logging:
  level:
    com.catchtable: DEBUG
